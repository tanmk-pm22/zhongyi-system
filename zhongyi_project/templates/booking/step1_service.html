{% extends "website_base.html" %}
{% block title %}在线预约 - 选择服务 | Booking - Select Service{% endblock %}
{% block content %}
<div class="container my-5">
    <h1 class="mb-4">在线预约 | Online Booking</h1>
    <div class="progress mb-4"><div class="progress-bar" style="width: 25%">步骤 1/4 | Step 1/4</div></div>
    <h3 class="mb-4">选择服务类型 | Select Service Type</h3>
    <form method="post">{% csrf_token %}
        <div class="row">
            {% for key, name in service_choices %}
                <div class="col-md-6 mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="service_type" id="service_{{ key }}" value="{{ key }}" required>
                        <label class="form-check-label" for="service_{{ key }}"><h5>{{ name }}</h5></label>
                    </div>
                </div>
            {% endfor %}
        </div>
        <button type="submit" class="btn btn-primary btn-lg mt-3">下一步 | Next <i class="bi bi-arrow-right"></i></button>
    </form>
</div>
{% endblock %}
